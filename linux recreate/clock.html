<!DOCTYPE html>
<html>
    <head>
        <title>clock</title>
        <style>
            /* Global dark background and text */
body {
    background-color: #1a1a1a; /* almost black */
    color: #f2f2f2; /* light gray text for readability */
    font-family: 'Courier New', Courier, monospace; /* techy, digital vibe */
    text-align: center;
    margin: 0;
    padding: 0;
}

/* Heading styles */
h1 {
    color: #ff4c4c; /* blood-red for urgency */
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
    margin: 20px 0;
}

/* Timer styling like a bomb display */
#timer {
    font-size: 5em;
    color: #ff0000;
    background-color: #330000;
    border: 4px solid #ff0000;
    border-radius: 50%;
    width: 150px;
    height: 150px;
    line-height: 150px;
    margin: 20px auto;
    box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000 inset;
}

/* Buttons styling */
button {
    background-color: #333;
    color: #ff4c4c;
    border: 2px solid #ff0000;
    border-radius: 5px;
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    transition: 0.2s all;
}

button:hover {
    background-color: #ff0000;
    color: #1a1a1a;
    box-shadow: 0 0 10px #ff0000;
}

/* Input box styling */
input#usi {
    background-color: #222;
    color: #ff4c4c;
    border: 2px solid #ff0000;
    padding: 10px;
    font-size: 1em;
    border-radius: 5px;
    text-align: center;
    margin: 10px 0;
}

/* Table styling for bomb keypad */
table#bomb-code {
    margin: 20px auto;
    border-collapse: collapse;
}

table#bomb-code th {
    padding: 10px;
}

table#bomb-code button {
    width: 60px;
    height: 60px;
    font-size: 1.5em;
}

/* Optional flicker animation for bomb timer */
@keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000 inset;
    }
    20%, 22%, 24%, 55% {
        text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000 inset;
    }
}

#timer {
    animation: flicker 1.5s infinite;
}

        </style>
    </head>
    <body>
        <h1> Bomb diffuse</h1>
       <h1 id = "timer">60</h1>
        <button onclick= "intman()"> Start Game</button>
        <input id = "usi" maxlength="7">
        <button onclick = "verify()">submit</button>
        <table id = "bomb-code">
           <tr><th><button>1</button></th><th><button>2</button></th><th><button>3</button></th></tr>
           <tr><th><button>4</button></th><th><button>5</button></th><th><button>6</button></th></tr>
           <tr><th><button>7</button></th><th><button>8</button></th><th><button>9</button></th></tr>
        </table>
        <script src = "clock.js"></script> 
    </body>
</html>
