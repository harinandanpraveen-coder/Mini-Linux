<!DOCTYPE html>
<html>
    <head>
<style>
    /* Page setup */
body {
    margin: 0;
    height: 100vh;
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: monospace;
}

#intro{
    color:  #00ff66;
    font-size: 60px;}
/* Terminal window */
#terminal {
    width: 80%;
    max-width: 900px;
    height: 70vh;
    background-color: #000;
    color: #00ff66;
    padding: 15px;
    box-sizing: border-box;
    overflow-y: auto;
    border-radius: 6px;
    box-shadow: 0 0 20px rgba(0, 255, 100, 0.25);
}

/* Each line */
#terminal div {
    line-height: 1.4;
}

/* Prompt */
#terminal span {
    color: #00ff66;
}

/* Input */
#terminal input {
    background: transparent;
    border: none;
    outline: none;
    color: #00ff66;
    font-family: inherit;
    font-size: 1em;
    caret-color: #00ff66;
    width: 80%;
}

/* Selection */
::selection {
    background: #00ff66;
    color: #000;
}

</style>
    </head>
    <body>
        <span id = "intro"></span>
        <div id="terminal">
        </div>
        <script src = "linux1.js">
        </script>
    </body>
</html>
