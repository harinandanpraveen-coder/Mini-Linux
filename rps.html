<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #4e73df, #1cc88a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

div {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    text-align: center;
}

img {
    width: 200px;
    border-radius: 10px;
    margin-bottom: 15px;
}

p {
    font-size: 18px;
    margin-bottom: 20px;
    font-weight: bold;
}

input[type="radio"] {
    margin: 10px 5px;
    cursor: pointer;
}

label {
    margin-right: 15px;
    font-size: 16px;
    cursor: pointer;
}

button {
    margin-top: 20px;
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: #4e73df;
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    background-color: #2e59d9;
    transform: scale(1.05);
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

        </style>
    </head>
    <body>
        <div>
            <img src = "https://platform.vox.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/3488502/shutterstock_106919999.0.jpg?quality=90&strip=all&crop=0,0,100,100">
            <p> select rock paper or scissor</p>
            <input type = "radio" name = "choice" value= "Rock"><label>Rock</label>
            <input type = "radio" name = "choice" value = "Scissor"><label>Scissor</label>
            <input type = "radio" name = "choice" value = "Paper" ><label>Paper</label>
            <button onclick="play()">Submit</button> 
        </div>
        <div id = "result">
        </div>
        <script src = "rps.js"></script>
    </body>
</html>
